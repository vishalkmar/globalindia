name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Phase 24 todo 08: scan the whole history for leaked secrets.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --exit-code 1 .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: own scanner (history)
        run: node scripts/scan-secrets.mjs --history
